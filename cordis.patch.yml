# dsh-session-delete bundle patch: inserts the host row into the profile's
# plugin roster. The browser half rides the package's `dsh.client` manifest
# (the client registry serves lib/client.js), and this row materializes the
# session-deletion host plugin on boot.
#
# Install with `dsh plugin --profile desktop add <path>`, or link the package
# into the profile and add `dsh-session-delete` to dsh.profile.bundles: the
# bundle patch is then applied automatically, so do NOT insert this row again
# in the profile's own cordis.patch.yml (duplicate ids crash the loader).
- insert:
    - id: session-delete
      name: 'dsh-session-delete'
